name: pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-dev:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v5.2.0
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build (dev)
        run: mvn clean package -Pdev

      - name: Test
        run: mvn test

      - name: Docker build
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/kukuk_backend:latest .

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker push
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/kukuk_backend_dev:latest

      - name: Deploy dev
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG_DEV }}" > $HOME/.kube/config
          kubectl apply -f deployment.yml
          kubectl apply -f service.yml

  deploy-prod:
    runs-on: ubuntu-latest
    needs: build-and-dev

    environment:
      name: prod  

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v5.2.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build (prod)
        run: mvn clean package -Pprod

      - name: Docker build (prod)
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/kukuk_backend:latest .

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker push (prod)
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/kukuk_backend_prod:latest

      - name: Deploy prod
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG_PROD }}" > $HOME/.kube/config
          kubectl apply -f deployment.yml
          kubectl apply -f service.yml
