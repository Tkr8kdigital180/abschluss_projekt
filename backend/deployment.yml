apiVersion: apps/v1
kind: Deployment
metadata:
  name: kukuk-frontend
  namespace: romeo-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kukuk-frontend
  template:
    metadata:
      labels:
        app: kukuk-frontend
    spec:
      containers:
        - name: frontend
          image: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/kukuk-backend:latest
          ports:
            - containerPort: 80
